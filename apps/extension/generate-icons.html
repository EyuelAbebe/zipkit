<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Icon Generator</title>
  </head>
  <body style="margin: 0; padding: 20px; font-family: monospace">
    <h2>ZipKit Icon Generator</h2>
    <p>Open this file in a browser and click the buttons to download icons:</p>
    <div id="icons"></div>
    <script>
      const iconSvg = `<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#2563EB"/>

  <!-- Zipper Design -->
  <path d="M64 20 L64 108" stroke="white" stroke-width="8" stroke-linecap="round"/>

  <!-- Zipper Teeth (Left) -->
  <rect x="44" y="28" width="12" height="8" rx="2" fill="white"/>
  <rect x="44" y="44" width="12" height="8" rx="2" fill="white"/>
  <rect x="44" y="60" width="12" height="8" rx="2" fill="white"/>
  <rect x="44" y="76" width="12" height="8" rx="2" fill="white"/>
  <rect x="44" y="92" width="12" height="8" rx="2" fill="white"/>

  <!-- Zipper Teeth (Right) -->
  <rect x="72" y="28" width="12" height="8" rx="2" fill="white"/>
  <rect x="72" y="44" width="12" height="8" rx="2" fill="white"/>
  <rect x="72" y="60" width="12" height="8" rx="2" fill="white"/>
  <rect x="72" y="76" width="12" height="8" rx="2" fill="white"/>
  <rect x="72" y="92" width="12" height="8" rx="2" fill="white"/>

  <!-- Zipper Pull -->
  <circle cx="64" cy="48" r="8" fill="#FCD34D"/>
</svg>
`;
      const sizes = [16, 32, 48, 128];

      function generateIcon(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        const svgBlob = new Blob([iconSvg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function () {
          ctx.drawImage(img, 0, 0, size, size);
          canvas.toBlob(function (blob) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `icon-${size}.png`;
            a.click();
            URL.revokeObjectURL(a.href);
          }, 'image/png');
          URL.revokeObjectURL(url);
        };

        img.src = url;
      }

      const container = document.getElementById('icons');
      sizes.forEach((size) => {
        const btn = document.createElement('button');
        btn.textContent = `Download icon-${size}.png`;
        btn.style.cssText = 'margin: 5px; padding: 10px 20px; font-size: 14px; cursor: pointer;';
        btn.onclick = () => generateIcon(size);
        container.appendChild(btn);
        container.appendChild(document.createElement('br'));
      });

      // Auto-generate all icons button
      const autoBtn = document.createElement('button');
      autoBtn.textContent = 'Download All Icons';
      autoBtn.style.cssText =
        'margin: 10px 5px; padding: 12px 24px; font-size: 16px; font-weight: bold; background: #2563EB; color: white; border: none; border-radius: 6px; cursor: pointer;';
      autoBtn.onclick = () => {
        sizes.forEach((size, i) => {
          setTimeout(() => generateIcon(size), i * 500);
        });
      };
      container.appendChild(autoBtn);
    </script>
  </body>
</html>
