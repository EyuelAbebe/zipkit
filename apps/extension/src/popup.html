<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZipKit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ZipKit</h1>
        <p class="tagline">Archive utility for the modern web</p>
      </header>

      <main>
        <div class="actions">
          <button id="open-archive" class="action-button primary">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"
              />
              <path d="M12 11v6" />
              <path d="M9 14h6" />
            </svg>
            <span>Open Archive</span>
          </button>

          <button id="create-archive" class="action-button secondary">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M12 8v8" />
              <path d="M8 12h8" />
            </svg>
            <span>Create Archive</span>
          </button>
        </div>
      </main>

      <footer>
        <p class="version">v0.0.0</p>
      </footer>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
