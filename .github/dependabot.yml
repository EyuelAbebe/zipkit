# Dependabot configuration for ZipKit
# Automates dependency updates and security alerts

version: 2
updates:
  # NPM dependencies for all workspaces
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    labels:
      - 'type:dependencies'
      - 'area:build'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    reviewers:
      - 'EyuelAbebe'
    # Group minor and patch updates together
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    labels:
      - 'type:dependencies'
      - 'area:ci'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    reviewers:
      - 'EyuelAbebe'
